<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Spine — supplier sourcing</title>
<style>
  :root{--bg:#0f1216;--panel:#171b21;--panel2:#1e242c;--line:#2a323c;--ink:#e7ecf2;--dim:#96a2b0;
        --grn:#1f7a44;--grnbg:#12301f;--red:#8a2b2b;--redbg:#2c1414;--amber:#8a6d1f;--amberbg:#2b2410;
        --accent:#4a90d9;--accent2:#2f6fb0;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px}
  .fc{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
  .fc.on{color:#8fe0ad;border-color:#255c3b;background:var(--grnbg)}
  .fc.off{color:#e2c07a;border-color:#5c4a25;background:var(--amberbg)}
  .wrap{padding:16px 20px;max-width:1500px}
  .controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-bottom:5px}
  input,select,button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  input#area{width:110px;text-transform:uppercase;font-weight:600;letter-spacing:1px}
  button{cursor:pointer}
  button.run{background:var(--accent);border-color:var(--accent2);color:#fff;font-weight:600;padding:9px 20px}
  button.run:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .chip{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--dim)}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  #log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#9fb3c8;background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;max-height:150px;overflow:auto;white-space:pre-wrap;display:none}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 14px;min-width:96px}
  .stat b{display:block;font-size:20px;font-weight:650}
  .stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .banner{padding:9px 13px;border-radius:8px;margin:10px 0;font-size:13px;border:1px solid}
  .banner.warn{background:var(--amberbg);border-color:#5c4a25;color:#e2c07a}
  h2{font-size:14px;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
  h2 .count{color:var(--dim);font-weight:400}
  h2 .exp{margin-left:auto}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:1100px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{position:sticky;top:0;background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);z-index:1}
  tr:hover td{background:#141922}
  .verdict{display:inline-block;font-weight:650;font-size:11.5px;padding:3px 9px;border-radius:6px;white-space:nowrap}
  .v-INDEPENDENT{color:#8fe0ad;background:var(--grnbg);border:1px solid #255c3b}
  .v-GROUP,.v-CHAIN{color:#e58c8c;background:var(--redbg);border:1px solid #5c2525}
  .v-UNKNOWN{color:#c4ccd6;background:#20262e;border:1px solid var(--line)}
  .owner{color:var(--dim);font-size:12px;margin-top:3px}
  a{color:#7bb6ea;text-decoration:none}a:hover{text-decoration:underline}
  .flag{color:#e2c07a;font-size:12px}
  .src{color:var(--dim);font-size:11.5px}
  .muted{color:var(--dim)}
  .empty{padding:26px;text-align:center;color:var(--dim)}
  code{background:#0b0e12;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>Register Spine</h1>
  <span class="sub">free-data supplier sourcing · Companies House → PSC → OSM → crawl</span>
  <span id="fc" class="fc">…</span>
</header>

<div class="wrap">
  <div class="controls">
    <div>
      <label>Postcode area</label>
      <input id="area" value="CO" maxlength="2" autocomplete="off">
      <div class="chips" id="areachips"></div>
    </div>
    <div>
      <label>Category</label>
      <select id="cat"></select>
    </div>
    <div>
      <label>Firecrawl key <span style="text-transform:none;letter-spacing:0">(optional — enables JS-site email scraping)</span></label>
      <input id="fckey" type="password" placeholder="fc-…  leave blank for free crawl" style="width:280px" autocomplete="off">
    </div>
    <button class="run" id="runbtn" onclick="run()">Run ▶</button>
    <div id="prep" class="hint"></div>
  </div>
  <div id="log"></div>

  <div id="results" style="display:none">
    <div class="stats" id="stats"></div>
    <div id="fcbanner"></div>

    <h2>Registered firms <span class="count" id="regcount"></span>
        <button class="ghost exp" onclick="exportCSV('reg')">Export CSV ⬇</button></h2>
    <div class="tablewrap"><table id="regtbl"></table></div>

    <h2>Found but NOT in the company register <span class="count" id="unregcount"></span>
        <button class="ghost exp" onclick="exportCSV('unreg')">Export CSV ⬇</button></h2>
    <div class="hint" style="margin:-2px 0 8px">Sole traders / partnerships the register can't see, plus chain branches — so you don't lose them.</div>
    <div class="tablewrap"><table id="unregtbl"></table></div>
  </div>
</div>

<script>
let DATA=null, SIC="96030";
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A=(u,t)=>u?`<a href="${esc(u.startsWith('http')?u:'https://'+u)}" target="_blank" rel="noopener">${esc(t||u)}</a>`:'<span class="muted">—</span>';

async function boot(){
  const s=await (await fetch('/api/status')).json();
  const cat=$('#cat'); s.categories.forEach(c=>{const o=document.createElement('option');o.value=c.sic;o.textContent=c.label;cat.appendChild(o);});
  const fc=$('#fc'); if(s.firecrawl){fc.className='fc on';fc.textContent='Firecrawl: ON';}else{fc.className='fc off';fc.textContent='Firecrawl: off (free crawl)';}
  $('#areachips').innerHTML=s.areas.map(a=>`<span class="chip" onclick="document.querySelector('#area').value='${a}'">${a}</span>`).join('');
  const c=s.cache;
  if(!c.index||!c.psc_index){
    $('#prep').innerHTML=`⚙ First run prepares register data once (~2–3 min): build the national index &amp; PSC map, then cache them.`;
  }
}
boot();

async function run(){
  const area=$('#area').value.trim().toUpperCase(); SIC=$('#cat').value;
  if(!area){alert('Enter a postcode area, e.g. CO');return;}
  $('#runbtn').disabled=true; $('#runbtn').textContent='Running…';
  const log=$('#log'); log.style.display='block'; log.textContent='Starting…';
  const fckey=$('#fckey').value.trim();
  const r=await (await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({area,sic:SIC,firecrawl_key:fckey})})).json();
  if(r.error){log.textContent='Error: '+r.error;reset();return;}
  poll(r.job_id);
}
function reset(){$('#runbtn').disabled=false;$('#runbtn').textContent='Run ▶';}

async function poll(id){
  const log=$('#log');
  const j=await (await fetch('/api/job?id='+id)).json();
  log.textContent=(j.log||[]).join('\n'); log.scrollTop=log.scrollHeight;
  if(j.state==='done'){DATA=j.result;render();reset();return;}
  if(j.state==='error'){log.textContent+='\n\n'+(j.error||'failed');reset();return;}
  setTimeout(()=>poll(id),900);
}

function render(){
  $('#results').style.display='block';
  const s=DATA.stats, ind=s.independence||{};
  $('#stats').innerHTML=[
    ['registered',s.registered_total],['independent',ind.INDEPENDENT||0],
    ['group/chain',(ind.GROUP||0)+(ind.CHAIN||0)],['unknown',ind.UNKNOWN||0],
    ['with email',s.with_email],['with website',s.with_website],
    ['web-search found',s.websites_discovered||0],
    ['unregistered',s.unregistered_total],['reg≠trading flags',s.mismatch_flags],
  ].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#fcbanner').innerHTML = s.firecrawl_used
    ? `<div class="banner" style="background:var(--grnbg);border-color:#255c3b;color:#8fe0ad">✓ Firecrawl ON — JS-rendered sites scraped for emails.</div>`
    : `<div class="banner warn">⚠ ${esc(s.firecrawl_note)}</div>`;
  $('#regcount').textContent=`— ${DATA.leads.length} in ${s.area} · ${s.category}`;
  $('#unregcount').textContent=`— ${DATA.unregistered.length} (${s.unregistered_independent} sole-trader / ${s.unregistered_chain} chain)`;

  const cols=['Firm','Independence','Registered address','Trading name(s)','Company no.','Website','Email','Phone','Sources','Flags'];
  let h='<thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  if(!DATA.leads.length) h+=`<tr><td colspan="${cols.length}" class="empty">No registered firms in this area.</td></tr>`;
  for(const l of DATA.leads){
    const v=l.independence;
    h+=`<tr>
      <td><b>${esc(l.company_name)}</b><div class="owner">${esc(l.status)}</div></td>
      <td><span class="verdict v-${v}">${v}</span><div class="owner">${esc(l.psc_owners||'—')}${l.corporate_owners?` <span class="flag">[${esc(l.corporate_owners)}]</span>`:''}</div></td>
      <td>${esc(l.reg_address||'—')}<div class="owner">${esc(l.reg_postcode)}</div></td>
      <td>${esc(l.trading_names||'—')}</td>
      <td>${esc(l.company_number)}</td>
      <td>${A(l.website)}</td>
      <td>${l.email?esc(l.email):'<span class="muted">—</span>'}<div class="owner">${esc(l.email_source||'')}</div></td>
      <td>${esc(l.phone||'—')}</td>
      <td class="src">${esc(l.sources)}</td>
      <td class="flag">${esc(l.flags||'')}</td>
    </tr>`;
  }
  $('#regtbl').innerHTML=h+'</tbody>';

  const uc=['Name','Kind','Postcode','Town','Website','Phone','Email'];
  let u='<thead><tr>'+uc.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  if(!DATA.unregistered.length) u+=`<tr><td colspan="${uc.length}" class="empty">None found.</td></tr>`;
  for(const r of DATA.unregistered){
    const chain=r.kind==='chain';
    u+=`<tr>
      <td><b>${esc(r.osm_name)}</b></td>
      <td><span class="verdict ${chain?'v-GROUP':'v-UNKNOWN'}">${chain?'CHAIN':'SOLE TRADER?'}</span></td>
      <td>${esc(r.postcode||'—')}</td><td>${esc(r.city||'—')}</td>
      <td>${A(r.website)}</td><td>${esc(r.phone||'—')}</td><td>${esc(r.email||'—')}</td>
    </tr>`;
  }
  $('#unregtbl').innerHTML=u+'</tbody>';
}

function exportCSV(which){
  if(!DATA)return;
  let rows,name;
  if(which==='reg'){
    name=`register_${DATA.stats.area}_${SIC}.csv`;
    const cols=['company_name','company_number','status','independence','psc_owners','corporate_owners','trading_names','reg_postcode','reg_address','website','email','email_source','phone','sources','flags'];
    rows=[cols].concat(DATA.leads.map(l=>cols.map(c=>l[c]??'')));
  }else{
    name=`unregistered_${DATA.stats.area}_${SIC}.csv`;
    const cols=['osm_name','kind','postcode','city','website','phone','email'];
    rows=[cols].concat(DATA.unregistered.map(r=>cols.map(c=>r[c]??'')));
  }
  const csv=rows.map(r=>r.map(x=>{x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();
}
</script>
</body>
</html>
